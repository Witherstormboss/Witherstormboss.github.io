<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead By Daylight Mobile Reborn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: url("Background.png"), url("Background.jpg");
            background-color: #1a1a1a;
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* === TOP GREY BANNER === */
        .top-banner {
            background: linear-gradient(rgba(90,90,90,0.95), rgba(70,70,70,0.95));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 30px;
            border-bottom: 2px solid #444;
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .banner-logo {
            height: 60px;
            width: auto;
        }

        .banner-title {
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
        }

        .banner-center-buttons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .banner-link-img {
            height: 70px;
            width: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .banner-link-img:hover {
            transform: scale(1.05);
        }

        .banner-avatar {
            height: 65px;
            width: auto;
        }

        /* === MAIN COVER IMAGE === */
        .cover-container {
            display: flex;
            justify-content: center;
            padding: 25px 15px;
        }

        .cover-img {
            max-width: 900px;
            width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        /* === BOTTOM BUTTONS ROW === */
        .bottom-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 10px 20px 40px;
            flex-wrap: wrap;
        }

        .bottom-link-img {
            height: 110px;
            width: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .bottom-link-img:hover {
            transform: scale(1.05);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .top-banner {
                flex-wrap: wrap;
                gap: 15px;
                justify-content: center;
                text-align: center;
                padding: 15px;
            }

            .banner-title {
                font-size: 1.3rem;
            }

            .banner-link-img {
                height: 55px;
            }

            .bottom-link-img {
                height: 90px;
            }
        }
    </style>
</head>
<body>
    <!-- TOP GREY BANNER -->
    <div class="top-banner">
        <div class="banner-left">
            <img src="Logo.png" alt="DBD Logo" class="banner-logo" onerror="this.src='Logo.png'">
            <span class="banner-title">Dead By Daylight mobile Reborn</span>
        </div>

        <div class="banner-center-buttons">
            <!-- News Button Image -->
            <a href="news.html">
                <img src="News.jpg" alt="News" class="banner-link-img" onerror="this.src='News.png'">
            </a>

            <!-- Updates Button Image -->
            <a href="updates.html">
                <img src="Update.jpg" alt="Updates" class="banner-link-img" onerror="this.src='Update.png'">
            </a>
        </div>

        <!-- Player Avatar -->
        <img src="Player.png" alt="Player Avatar" class="banner-avatar" onerror="this.src='Player.jpg'">
    </div>

    <!-- MAIN COVER IMAGE -->
    <div class="cover-container">
        <img src="Cover.png" alt="Main Game Interface" class="cover-img" onerror="this.src='Cover.jpg'">
    </div>

    <!-- BOTTOM BUTTONS -->
    <div class="bottom-buttons">
        <!-- YouTube Button Image -->
        <a href="https://www.youtube.com/@WitherstormBoss15" target="_blank">
            <img src="Youtube.jpg" alt="YouTube Channel" class="bottom-link-img" onerror="this.src='Youtube.png'">
        </a>

        <!-- Download Button Image -->
        <a href="https://www.mediafire.com/file/up5msgxdn0ql8p0/dbdm.apks/file" target="_blank">
            <img src="Download.jpg" alt="Download" class="bottom-link-img" onerror="this.src='Download.png'">
        </a>

        <!-- Tutorial Button Image -->
        <a href="tutorial.html">
            <img src="Tutorial.jpg" alt="Tutorial" class="bottom-link-img" onerror="this.src='Tutorial.png'">
        </a>
    </div>
</body>
</html>
