<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD BY DAYLIGHT</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; cursor:pointer; }

.bg {
  position:absolute; inset:0;
  background: url('./Background.jpg') center/cover no-repeat black;
}

.logo {
  position:absolute;
  top:45%; left:50%;
  transform:translate(-50%, -50%);
  max-width:55%; max-height:45%;
  object-fit:contain;
}

.bottom-container {
  position:absolute;
  bottom:10%; width:100%; text-align:center;
  color:white; text-shadow:0 0 8px rgba(0,0,0,0.9);
}

.game-title {
  font-size:clamp(2rem,6vw,4rem);
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:0.3em;
}

.tap-hint {
  font-size:clamp(1.2rem,3vw,2rem);
  opacity:0.8;
  animation:pulse 1.5s infinite;
}

.loading-status {
  font-size:clamp(1rem,2.5vw,1.8rem);
  color:#ddd;
  display:none;
}

.spinner {
  display:inline-block;
  margin-left:0.5em;
  animation:spin 1s linear infinite;
}

@keyframes pulse {
  0%,100% { opacity:0.6; }
  50% { opacity:1; }
}

@keyframes spin {
  to { transform:rotate(360deg); }
}
</style>
</head>
<body>

<div class="bg"></div>
<img src="./Logo.png" alt="Logo" class="logo" id="logo">

<div class="bottom-container">
  <div class="game-title">DEAD BY DAYLIGHT</div>
  <div class="tap-hint" id="tapHint">Tap to continue.</div>
  <div class="loading-status" id="status1">Connecting to server<span class="spinner">...</span></div>
  <div class="loading-status" id="status2">Downloading Player data<span class="spinner">...</span></div>
  <div class="loading-status" id="status3">Loading bloodweb<span class="spinner">...</span></div>
  <div class="loading-status" id="status4">Loading Shaders<span class="spinner">...</span></div>
</div>

<!-- Audio with fallback + preload fix -->
<audio id="bgMusic" loop preload="auto">
  <source src="./Loading.mp3" type="audio/mpeg">
  <source src="./Loading.mp3" type="audio/mp3">
  Your browser does not support audio.


<script>
const bgMusic = document.getElementById('bgMusic');
const tapHint = document.getElementById('tapHint');
const statuses = [
  document.getElementById('status1'),
  document.getElementById('status2'),
  document.getElementById('status3'),
  document.getElementById('status4')
];

const delays = [2000, 2500, 2000, 1800];
let started = false;

// Pre-load audio early
bgMusic.load();
bgMusic.volume = 0.8;

async function startLoading() {
  if (started) return;
  started = true;

  tapHint.style.display = 'none';

  // FORCE music start — multiple methods
  try {
    bgMusic.currentTime = 0;
    const playPromise = bgMusic.play();
    if (playPromise !== undefined) {
      await playPromise;
      console.log('✅ Music playing');
    }
  } catch (err) {
    console.log('🔄 Retrying audio...', err);
    // Fallback: recreate audio element
    bgMusic.remove();
    const newAudio = document.createElement('audio');
    newAudio.id = 'bgMusic';
    newAudio.loop = true;
    newAudio.preload = 'auto';
    newAudio.volume = 0.8;
    newAudio.src = './Loading.mp3';
    document.body.appendChild(newAudio);
    await newAudio.play();
  }

  // Loading sequence
  for (let i = 0; i < statuses.length; i++) {
    statuses[i].style.display = 'block';
    await new Promise(r => setTimeout(r, delays[i]));
    statuses[i].style.display = 'none';
  }

  window.location.href = './game.html';
}

document.body.addEventListener('click', startLoading);
document.body.addEventListener('touchstart', startLoading, { passive: true });
</script>

</body>
</html>
