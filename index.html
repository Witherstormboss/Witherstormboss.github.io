<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WitherNet — Rec Paint</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #ff7b00; /* Bright orange — NO background.png needed! */
    color: white;
    text-align: center;
    min-height: 100vh;
}

/* =========================
   TOP YELLOW HEADER BAR
========================= */
.top-bar {
    background: #ffcc00;
    padding: 12px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

/* LOGO — Rec + Head + Paint */
.logo-image {
    height: 55px;
    width: auto;
}

.top-links a {
    color: #0055ff;
    font-size: 26px;
    font-weight: bold;
    text-decoration: none;
    margin-left: 15px;
}
.top-links a:hover {
    text-decoration: underline;
}

/* =========================
   MAIN CONTENT
========================= */
.content {
    padding-top: 80px;
}

h1 {
    font-size: 72px;
    color: white;
    text-shadow: 4px 4px 0 #000;
    line-height: 1.2;
}

.subtitle {
    font-size: 52px;
    color: white;
    text-shadow: 3px 3px 0 #000;
    margin-top: 10px;
    margin-bottom: 60px;
}

/* =========================
   DOWNLOAD BUTTON — WITH LOGO
========================= */
.download-btn {
    background: #ff4400;
    color: white;
    font-size: 30px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    padding: 18px 50px;
    display: inline-flex;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    transition: 0.15s;
}

.download-btn:hover {
    background: #e63d00;
    transform: translateY(-3px);
}

/* Small logo icon inside button */
.btn-logo {
    height: 40px;
    width: auto;
}

/* =========================
   BOTTOM CREDIT
========================= */
.credit {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 28px;
    color: white;
    text-shadow: 2px 2px 0 #000;
}

/* =========================
   MOBILE RESPONSIVE
========================= */
@media (max-width: 900px) {
    .top-bar { flex-direction: column; gap: 10px; padding: 15px; }
    .logo-image { height: 45px; }
    .top-links a { font-size: 18px; margin: 0 6px; }
    h1 { font-size: 42px; }
    .subtitle { font-size: 30px; }
    .download-btn { font-size: 20px; padding: 14px 25px; gap: 12px; }
    .btn-logo { height: 32px; }
    .credit { font-size: 18px; }
}
</style>
</head>
<body>

<!-- TOP YELLOW BAR — YOUR LOGO HERE -->
<div class="top-bar">
    <img src="Logo.png" alt="Rec Paint" class="logo-image">
    <div class="top-links">
        <a href="https://youtube.com/post/UgkxrY2MlojfyGA56JaYiKqtTwyOGf0e4KlL?si=TapHbSju5_TFdJ4X" target="_blank">More info</a>
        <a href="https://youtube.com/post/UgkxrY2MlojfyGA56JaYiKqtTwyOGf0e4KlL?si=TapHbSju5_TFdJ4X" target="_blank">Youtube</a>
        <a href="#" onclick="return false;">More games!</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="content">
    <h1>Welcome to WitherNet!</h1>
    <p class="subtitle">Play Rec Paint Free!</p>

    <!-- DOWNLOAD BUTTON — LOGO + TEXT -->
    <button class="download-btn" onclick="openDownload()">
        <img src="Logo.png" alt="" class="btn-logo">
        DOWNLOAD FOR ANDROID
    </button>
</div>

<!-- BOTTOM CREDIT -->
<div class="credit">Made by @Witherstormboss15</div>

<script>
function openDownload() {
    window.open("https://youtube.com/post/UgkxrY2MlojfyGA56JaYiKqtTwyOGf0e4KlL?si=TapHbSju5_TFdJ4X", "_blank");
}
</script>

</body>
</html>
