<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloodweb</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }
        
        #bg { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.3; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; padding: 30px; }
        
        header { display: flex; justify-content: space-between; align-items: center; }
        .title-box { display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-left: 4px solid #ff3333; }
        .bp-container { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 4px; }
        .hud-icon { height: 35px; width: auto; }

        /* Node Web Map Matrix Track Layout */
        #web-center-canvas { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 500px; height: 500px; display: flex; justify-content: center; align-items: center; }
        .center-hub { width: 80px; height: 80px; background: #222; border: 3px solid #444; border-radius: 50%; z-index: 5; }
        
        .bloodweb-node { position: absolute; width: 65px; height: 65px; background: rgba(20,20,20,0.85); border: 2px dashed #555; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, background 0.2s; z-index: 10; }
        .bloodweb-node img { width: 85%; height: 85%; object-fit: contain; opacity: 0.4; filter: grayscale(1); }
        .bloodweb-node:hover { transform: scale(1.08); border-color: #ff3333; }
        
        /* Unlocked Permanent Purchase Styling States */
        .bloodweb-node.unlocked { border: 2px solid #ff9900; background: rgba(139, 0, 0, 0.4); box-shadow: 0 0 15px #ff9900; }
        .bloodweb-node.unlocked img { opacity: 1; filter: none; }

        /* Coordinates Assignment Mapping Positions */
        #node-1 { top: 40px; left: 215px; }
        #node-2 { top: 215px; left: 40px; }
        #node-3 { top: 215px; right: 40px; }
        #node-4 { bottom: 40px; left: 215px; }

        footer { display: flex; justify-content: flex-start; }
        .action-btn { background: none; border: none; cursor: pointer; }
        .action-btn img { height: 65px; width: auto; }
    </style>
</head>
<body>

    <img id="bg" src="Background.gif" alt="Campfire">

    <div id="ui-layer">
        <header>
            <div class="title-box">
                <img src="Bloodweb.png" style="width:40px; height:40px; object-fit:fill;">
                <h2>BLOODWEB ENTITY</h2>
            </div>
            <div class="bp-container">
                <img class="hud-icon" src="Bloodpoints.png" alt="BP">
                <span id="bp-val" style="font-size:20px; font-weight:bold; color:#ff3333;">50,000</span>
            </div>
        </header>

        <!-- Web Ring Configuration Nodes Layout Container -->
        <div id="web-center-canvas">
            <div class="center-hub"></div>
            
            <div class="bloodweb-node" id="node-1" onclick="purchaseNode('node-1')"><img src="perk.png"></div>
            <div class="bloodweb-node" id="node-2" onclick="purchaseNode('node-2')"><img src="perk.png"></div>
            <div class="bloodweb-node" id="node-3" onclick="purchaseNode('node-3')"><img src="perk.png"></div>
            <div class="bloodweb-node" id="node-4" onclick="purchaseNode('node-4')"><img src="perk.png"></div>
        </div>

        <footer>
            <button class="action-btn" onclick="window.location.href='lobby.html'"><img src="Back.png" alt="Back"></button>
        </footer>
    </div>

    <script>
        // Global Wallet Balancing Track Engine Setup
        let currentBP = Number(localStorage.getItem('bloodpoints')) || 50000;
        document.getElementById('bp-val').textContent = currentBP.toLocaleString();

        function purchaseNode(nodeId) {
            const targetNode = document.getElementById(nodeId);
            
            // Abort if already purchased
            if(targetNode.classList.contains('unlocked')) return;

            // Cost per tier item node
            const itemCost = 3000;

            if(currentBP >= itemCost) {
                currentBP -= itemCost;
                localStorage.setItem('bloodpoints', currentBP);
                document.getElementById('bp-val').textContent = currentBP.toLocaleString();
                
                // Set Unlocked State visually
                targetNode.classList.add('unlocked');
            } else {
                alert("Insufficient Bloodpoints! Complete trials to earn more.");
            }
        }
    </script>
</body>
</html>
