<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dead by Daylight Mobile - Menu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial', sans-serif;
        }
        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: url('Background.gif') no-repeat center center;
            background-size: cover;
        }
        /* Top Right Info Bar */
        .top-right-bar {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            z-index: 10;
        }
        .currency-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .currency-amount {
            color: #ffffff;
            font-size: 42px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .currency-icon {
            width: 45px;
            height: auto;
            object-fit: contain;
        }
        .profile-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-pic {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }
        .profile-text {
            display: flex;
            flex-direction: column;
        }
        .player-name {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
        }
        .player-level {
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }

        /* Left Main Menu Side Buttons */
        .left-menu {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            z-index: 10;
        }
        .menu-btn {
            width: 150px;
            height: 150px;
            background-color: transparent;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            cursor: pointer;
            display: block;
            text-decoration: none;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .menu-btn:hover {
            border-color: rgba(255, 255, 255, 0.9);
        }
        .menu-btn img {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Stretches completely to fill the dashed border box */
            display: block;
        }
    </style>
</head>
<body>

    <div class="screen-container">
        <!-- Currency and Profile Header Data Layer -->
        <div class="top-right-bar">
            <div class="currency-container">
                <span class="currency-amount">0</span>
                <img src="Bloodpoints.png" alt="Bloodpoints" class="currency-icon">
            </div>
            <div class="profile-container">
                <div class="profile-text">
                    <span class="player-name">PlayerName</span>
                    <span class="player-level">Level 1</span>
                </div>
                <img src="Player.png" alt="Profile" class="profile-pic">
            </div>
        </div>

        <!-- Dynamic Dashboard Selection Grid -->
        <div class="left-menu">
            <!-- Play as Killer Layout Interface Container -->
            <a href="killerlobby.html" class="menu-btn">
                <img src="Play_killer.png" alt="Play As Killer">
            </a>

            <!-- Play as Survivor Layout Interface Container -->
            <a href="lobby.html" class="menu-btn">
                <img src="Play_surv.png" alt="Play As Survivor">
            </a>

            <!-- Store Panel Container -->
            <div class="menu-btn">
                <img src="store.png" alt="Store">
            </div>
        </div>
    </div>

</body>
</html>
