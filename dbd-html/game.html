<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connection Error</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;

        font-family: Arial, Helvetica, sans-serif;

        background:
            radial-gradient(circle at center, #242424 0%, #111111 55%, #080808 100%);

        color: #ffffff;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Dark atmospheric overlay */
    .screen-overlay {
        position: fixed;
        inset: 0;

        background:
            linear-gradient(
                rgba(0,0,0,0.18),
                rgba(0,0,0,0.55)
            );

        pointer-events: none;
    }

    /* Main dialog */
    .dialog {
        position: relative;

        width: min(92vw, 620px);

        background: #050505;

        border: 1px solid #343434;

        box-shadow:
            0 18px 50px rgba(0,0,0,0.85),
            0 0 0 1px rgba(255,255,255,0.025);

        animation: appear 0.18s ease-out;
    }

    /* Red DBD-style title bar */
    .title-bar {
        position: relative;

        height: 58px;

        display: flex;
        align-items: center;

        padding: 0 24px;

        background:
            linear-gradient(
                90deg,
                #7d0909 0%,
                #a30d0d 45%,
                #730707 100%
            );

        border-bottom: 2px solid #3d0000;

        box-shadow:
            inset 0 1px rgba(255,255,255,0.08),
            0 3px 12px rgba(0,0,0,0.6);
    }

    /* Small angled decoration */
    .title-bar::after {
        content: "";

        position: absolute;

        right: 0;
        bottom: -2px;

        width: 85px;
        height: 2px;

        background: #d21a1a;
    }

    .title {
        margin: 0;

        font-size: 23px;
        font-weight: 700;

        letter-spacing: 1px;

        text-transform: uppercase;

        text-shadow:
            2px 2px 0 rgba(0,0,0,0.45);
    }

    /* Message area */
    .content {
        min-height: 185px;

        padding: 34px 34px 30px;

        background:
            linear-gradient(
                180deg,
                #090909 0%,
                #050505 100%
            );
    }

    .message {
        margin: 0;

        color: #e0e0e0;

        font-size: 17px;

        line-height: 1.55;

        letter-spacing: 0.15px;
    }

    .version {
        margin: 13px 0 0;

        color: #777777;

        font-size: 13px;

        letter-spacing: 0.25px;
    }

    /* Bottom section */
    .bottom {
        position: relative;

        height: 72px;

        display: flex;
        align-items: center;

        padding: 0 24px;

        background: #0b0b0b;

        border-top: 1px solid #252525;
    }

    /*
        Back button sits at the far left
        of the message/dialog area.
    */
    .back-button {
        display: block;

        width: 130px;
        height: auto;

        cursor: pointer;

        -webkit-tap-highlight-color: transparent;

        transition:
            transform 0.08s ease,
            filter 0.08s ease;
    }

    .back-button:hover {
        filter: brightness(1.15);
    }

    .back-button:active {
        transform: scale(0.94);
        filter: brightness(0.8);
    }

    /* Subtle angular corner */
    .corner {
        position: absolute;

        right: 0;
        bottom: 0;

        width: 25px;
        height: 25px;

        border-left: 1px solid #292929;
        border-top: 1px solid #292929;

        opacity: 0.7;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: scale(0.97);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    /* Smaller screens */
    @media (max-width: 500px) {

        .dialog {
            width: 94vw;
        }

        .title-bar {
            height: 52px;
            padding: 0 18px;
        }

        .title {
            font-size: 19px;
        }

        .content {
            padding: 27px 22px 25px;
        }

        .message {
            font-size: 15px;
        }

        .version {
            font-size: 12px;
        }

        .bottom {
            height: 65px;
            padding: 0 16px;
        }

        .back-button {
            width: 115px;
        }
    }
</style>
</head>

<body>

<div class="screen-overlay"></div>

<div class="dialog">

    <div class="title-bar">
        <h1 class="title">Connection error</h1>
    </div>

    <div class="content">

        <p class="message">
            Failed to download resources for match
        </p>

        <p class="version">
            your version: PRIVATE TEST BUILD 0.1
        </p>

    </div>

    <div class="bottom">

        <img
            src="Back.png"
            class="back-button"
            alt="Back"
            onclick="window.location.href='menu.html'"
        >

        <div class="corner"></div>

    </div>

</div>

</body>
</html>
