<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connection Error</title>

<style>
    * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #101010;
        color: white;
    }

    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Dark textureless background */
    .background {
        position: fixed;
        inset: 0;
        background: #101010;
        z-index: 0;
    }

    /* Slight dark overlay */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 1;
    }

    /* Error window */
    .error-box {
        position: relative;
        z-index: 2;

        width: min(90%, 520px);

        padding: 32px 35px 30px;

        background: #181818;
        border: 1px solid #3a3a3a;

        box-shadow:
            0 8px 30px rgba(0, 0, 0, 0.75),
            inset 0 1px rgba(255,255,255,0.03);

        text-align: center;
    }

    .title {
        margin: 0 0 22px;

        font-size: 28px;
        font-weight: 600;

        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .message {
        margin: 0 auto;

        max-width: 440px;

        color: #c8c8c8;

        font-size: 16px;
        line-height: 1.5;
    }

    .version {
        margin: 8px 0 0;

        color: #999;

        font-size: 14px;
        line-height: 1.4;
    }

    /* Back.png button */
    .back-button {
        display: block;

        width: 160px;
        height: auto;

        margin: 28px auto 0;

        cursor: pointer;

        -webkit-tap-highlight-color: transparent;

        transition: transform 0.08s ease;
    }

    .back-button:active {
        transform: scale(0.96);
    }
</style>
</head>

<body>

<div class="background"></div>

<div class="overlay"></div>

<div class="error-box">

    <h1 class="title">
        Connection error
    </h1>

    <p class="message">
        Failed to download resources for match
    </p>

    <p class="version">
        your version: PRIVATE TEST BUILD 0.1
    </p>

    <img
        src="Back.png"
        class="back-button"
        alt="Back"
        onclick="window.location.href='menu.html'"
    >

</div>

</body>
</html>
