<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Rec Room - Standalone Hub</title>
    <style>
        /* Base setup to lock content alignment and expand to absolute edge boundaries */
        * {
            box-sizing: border-box;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center; 
            overflow: hidden;
            font-family: sans-serif;
            color: white;
            user-select: none;
            position: relative;
        }

        /* 1. Fully Stretched Background Layer */
        #bgLayer {
            position: absolute;
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh;
            background-image: url('loading_background.gif');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            z-index: 1;
        }

        /* 2. Loading Phase Container (Responsive Center Grid) */
        #loadingContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            opacity: 0;
            transform: translateY(0);
            width: 100%;
            height: 100%;
        }

        @keyframes slideDownIn {
            0% { transform: translateY(-100vh); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes slideUpOut {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-100vh); opacity: 0; }
        }

        .animate-entry {
            animation: slideDownIn 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .animate-exit {
            animation: slideUpOut 1s cubic-bezier(0.5, 0, 0.75, 0) forwards;
        }

        /* Game Logo scales relative to total width of viewport */
        #gameLogo {
            width: 45vw; 
            max-width: 500px;
            height: auto;
            margin-bottom: 4vh;
        }

        #statusText {
            font-size: 3.5vh; 
            font-weight: bold;
            margin-top: 3.5vh; 
            margin-bottom: 0px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            text-align: center;
        }

        /* Loading bar stretches to match 70% of the screen */
        .bar-container {
            position: relative;
            background-image: url('loading_empty.png'); 
            background-size: 100% 100%;
            width: 70vw; 
            height: 5vh; 
            min-height: 25px;
            max-height: 40px;
        }

        .bar-fill {
            position: absolute;
            top: 0; left: 0;
            background-image: url('loading_full.png'); 
            background-size: 100% 100%; 
            width: 0%; 
            height: 100%;
            transition: width 0.1s linear;
        }

        /* 3. Login Menu Container */
        #loginContainer {
            display: none;
            position: absolute;
            right: 5vw; 
            z-index: 3;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        /* Expanded Landscape Play Box Window Frame */
        .play-menu-box {
            position: relative;
            background-image: url('play_menu_box.png'); 
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            width: 45vw; 
            min-width: 320px;
            max-width: 620px;
            height: 60vh; 
            min-height: 260px;
            max-height: 380px;
            box-sizing: border-box;
        }

        /* Absolute Inner Alignment Layer */
        .box-content-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Wide Landscape Play Button */
        .play-btn {
            background-image: url('play_button.png'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            border: none;
            
            width: 22vw;  
            min-width: 180px;
            max-width: 300px;
            height: 9vh;  
            min-height: 40px;
            max-height: 68px;
            
            outline: none;
            margin-top: auto; 
            margin-bottom: 12.5vh; 
            
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .play-btn:active {
            transform: scale(0.94);
        }
    </style>
</head>
<body>

    <!-- Main Menu Loop Track Audio -->
    <audio id="bgMusic" autoplay loop src="menu.wav"></audio>

    <!-- Background Asset Layer -->
    <div id="bgLayer"></div>

    <!-- Interface Scene 1: Loading (Centered) -->
    <div id="loadingContainer">
        <img id="gameLogo" src="Logo_RecRoom_Horizontal.png">
        <div class="bar-container" id="logoWrapper">
            <div class="bar-fill" id="fillTracker"></div>
        </div>
        <div id="statusText">Connecting to server...</div>
    </div>

    <!-- Interface Scene 2: Menu Grid -->
    <div id="loginContainer">
        <div class="play-menu-box">
            <div class="box-content-layer">
                <button class="play-btn" onclick="launchGameScreen()"></button>
            </div>
        </div> 
    </div>

    <!-- FIXED SCRIPT BLOCK: All JavaScript logic is contained inside this tag -->
    <script>
        let bg = document.getElementById('bgLayer');
        let logo = document.getElementById('gameLogo');
        let text = document.getElementById('statusText');
        let wrapper = document.getElementById('logoWrapper');
        let fill = document.getElementById('fillTracker');
        let loadingScene = document.getElementById('loadingContainer');
        let loginScene = document.getElementById('loginContainer');
        let music = document.getElementById('bgMusic');

        let totalDuration = 10000; 
        let elapsedTime = 0;
        let tickerInterval;

        function simulateNativeTouch() {
            music.play().catch(e => console.log("Audio node awake."));
        }
        window.addEventListener('DOMContentLoaded', simulateNativeTouch);
        window.addEventListener('load', simulateNativeTouch);
        document.body.addEventListener('click', () => { music.play(); }, { once: true });

        setTimeout(() => {
            simulateNativeTouch();
            bg.style.opacity = "1";
            setTimeout(() => {
                loadingScene.classList.add('animate-entry');
                setTimeout(() => {
                    startProgressBarTracking();
                }, 1000);
            }, 1000);
        }, 2000);

        function startProgressBarTracking() {
            let updateSpeed = 100; // Update progress bar every 100ms
            
            tickerInterval = setInterval(() => {
                elapsedTime += updateSpeed;
                let currentPercentage = (elapsedTime / totalDuration) * 100;
                
                if (currentPercentage >= 100) {
                    currentPercentage = 100;
                    clearInterval(tickerInterval);
                    fill.style.width = "100%";
                    text.innerText = "Done!";
                    setTimeout(transitionToLoginBox, 1000);
                } else {
                    fill.style.width = currentPercentage + "%";
                    
                    // Fixed dynamic update text logic states
                    if (currentPercentage > 75) {
                        text.innerText = "Downloading Player Data...";
                    } else if (currentPercentage > 40) {
                        text.innerText = "Downloading Room Data...";
                    } else if (currentPercentage > 15) {
                        text.innerText = "Downloading Textures...";
                    }
                }
            }, updateSpeed);
        }

        function transitionToLoginBox() {
            // Animate the loading layout container off the screen upwards
            loadingScene.classList.remove('animate-entry');
            loadingScene.classList.add('animate-exit');
            
            setTimeout(() => {
                loadingScene.style.display = "none";
                loginScene.style.display = "block";
                
                // Fade the Play menu box into view smoothly
                setTimeout(() => {
                    loginScene.style.opacity = "1";
                }, 50);
            }, 1000);
        }

        // FIXED INTEGRATION LAUNCH ROUTER
        function launchGameScreen() {
            // Checks if running under AndroidX WebViewAssetLoader hosting environment wrapper
            if (window.location.origin.includes("androidplatform")) {
                window.location.href = "https://androidplatform.net";
            } else {
                window.location.href = "game.html";
            }
        }
    </script>
</body>
</html>
